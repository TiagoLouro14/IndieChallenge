openapi: 3.0.1
info:
  title: Roadtrip Designer API
  description: API for planning roadtrips with POIs in Portugal
  version: v1
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/v1/locations:
    get:
      summary: List all locations
      tags:
        - Locations
      responses:
        '200':
          description: Array of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
  /api/v1/locations/{id}:
    get:
      summary: Get a location
      tags:
        - Locations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Location found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Location not found
  /api/v1/pois:
    get:
      summary: List POIs
      tags:
        - POIs
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category name
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Paginated POI list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Poi'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
  /api/v1/pois/{id}:
    get:
      summary: Get a POI
      tags:
        - POIs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: POI found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poi'
        '404':
          description: POI not found
  /api/v1/pois/nearest:
    get:
      summary: Find nearest POI to coordinates
      tags:
        - POIs
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
          description: Latitude
        - name: lng
          in: query
          required: true
          schema:
            type: number
          description: Longitude
      responses:
        '200':
          description: Nearest POI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poi'
        '400':
          description: Missing lat or lng
        '404':
          description: No POIs found
  /api/v1/trips/plan:
    get:
      summary: Plan a roadtrip
      tags:
        - Trips
      parameters:
        - name: origin_id
          in: query
          required: true
          schema:
            type: integer
          description: Location ID for trip origin
        - name: destination_id
          in: query
          required: true
          schema:
            type: integer
          description: Location ID for trip destination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Max number of stops (1-50)
        - name: categories
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated category filter (e.g. beach,nature)
      responses:
        '200':
          description: Trip plan with ordered stops
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPlan'
        '422':
          description: Invalid origin or destination
components:
  schemas:
    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        region:
          type: string
        lat:
          type: number
        lng:
          type: number
    Poi:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        lat:
          type: number
        lng:
          type: number
        categories:
          type: array
          items:
            type: string
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer
    TripPlan:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Poi'
        route_legs:
          type: array
          nullable: true
          description: Per-leg coordinate arrays for map rendering. One entry per leg (stops+1). Each entry is an array of [lng, lat] pairs. Null if OSRM is unavailable.
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
